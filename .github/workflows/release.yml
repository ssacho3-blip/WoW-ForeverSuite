name: ForeverSuite Release (Rust fsx)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify & publish (e.g., v6.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate semver tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver tag format: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust fsx unit tests
        run: cargo test --manifest-path tools/fsx/Cargo.toml

      - name: Build fsx and run 7-layer AST check & Lua 5.1 VM test suite
        run: |
          cargo build --release --manifest-path tools/fsx/Cargo.toml
          ./tools/fsx/target/release/fsx check v2/ForeverSuite
          ./tools/fsx/target/release/fsx check v2/ForeverSuite_Data
          ./tools/fsx/target/release/fsx check v2/ForeverSuite_Media
          ./tools/fsx/target/release/fsx test v2

      - name: Build verified Core (<= 18 MB) & separate DataPack (<= 30 MB) release ZIPs & SHA-256
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ./tools/fsx/target/release/fsx package \
            --source v2 \
            --out dist \
            --tag "$TAG" \
            --max-mb 18 \
            --datapack-max-mb 30
          test -s "dist/ForeverSuite-v${VER}.zip"
          test -s "dist/ForeverSuite-v${VER}.zip.sha256"
          test -s "dist/ForeverSuite-DataPack-v${VER}.zip"
          test -s "dist/ForeverSuite-DataPack-v${VER}.zip.sha256"
          (cd dist && sha256sum -c "ForeverSuite-v${VER}.zip.sha256" && sha256sum -c "ForeverSuite-DataPack-v${VER}.zip.sha256")

      - name: Publish or update GitHub Release atomically (Draft -> Upload -> Verify Assets -> Publish)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.version }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          ZIP_NAME="ForeverSuite-v${VER}.zip"
          SHA_NAME="ForeverSuite-v${VER}.zip.sha256"
          DP_ZIP_NAME="ForeverSuite-DataPack-v${VER}.zip"
          DP_SHA_NAME="ForeverSuite-DataPack-v${VER}.zip.sha256"
          ZIP_PATH="dist/${ZIP_NAME}"
          SHA_PATH="dist/${SHA_NAME}"
          DP_ZIP_PATH="dist/${DP_ZIP_NAME}"
          DP_SHA_PATH="dist/${DP_SHA_NAME}"
          TARGET_SHA=$(git rev-parse HEAD)
          if gh release view "$TAG" --repo "$REPO_SLUG" >/dev/null 2>&1; then
            # Move existing release to draft while replacing paired assets so partial failure never exposes mismatched ZIP/SHA
            gh release edit "$TAG" --repo "$REPO_SLUG" --draft=true
            gh release upload "$TAG" "$ZIP_PATH" "$SHA_PATH" "$DP_ZIP_PATH" "$DP_SHA_PATH" --repo "$REPO_SLUG" --clobber
          else
            gh release create "$TAG" "$ZIP_PATH" "$SHA_PATH" "$DP_ZIP_PATH" "$DP_SHA_PATH" \
              --repo "$REPO_SLUG" \
              --target "$TARGET_SHA" \
              --verify-tag \
              --title "ForeverSuite ${TAG}" \
              --generate-notes \
              --draft
          fi
          # Verify all 4 paired assets exist with non-zero size before publishing live
          for ASSET in "$ZIP_NAME" "$SHA_NAME" "$DP_ZIP_NAME" "$DP_SHA_NAME"; do
            ASSET_SIZE=$(gh release view "$TAG" --repo "$REPO_SLUG" --json assets --jq ".assets[] | select(.name == \"${ASSET}\") | .size")
            test -n "$ASSET_SIZE"
            [ "$ASSET_SIZE" -gt 0 ]
          done
          gh release edit "$TAG" --repo "$REPO_SLUG" --title "ForeverSuite ${TAG}" --draft=false --latest
