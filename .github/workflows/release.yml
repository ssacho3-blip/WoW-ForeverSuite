name: ForeverSuite Release & Auto-Mail

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify/publish (e.g., v0.3.4)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve target release tag & verify TOC version parity
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver tag format: $TAG"
            exit 1
          fi
          TAG_VER="${TAG#v}"
          TOC_VER=$(python3 -c 'import pathlib; from scripts.build_win_exe import read_suite_version; print(read_suite_version(pathlib.Path(".")))')
          if [ "$TAG_VER" != "$TOC_VER" ]; then
            echo "::error::Tag version ($TAG_VER) != ForeverSuite.toc version ($TOC_VER)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$TAG_VER" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lua 5.1 & luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-dev luarocks
          sudo luarocks --lua-version=5.1 install luacheck 1.1.2-1

      - name: Install test & optional Gmail API dependencies
        run: python -m pip install --upgrade pip pytest google-api-python-client google-auth

      - name: Run luacheck static analysis
        run: luacheck --config .luacheckrc ForeverSuite ForeverSuite_GJBridge

      - name: Run BDD/DDT & Lua static suites
        run: pytest tests/ -v --strict-markers -m "not upstream_local"

      - name: Build & verify release ZIP and Windows PE32+ installer
        env:
          VER: ${{ steps.meta.outputs.version }}
        run: |
          python3 scripts/package_release.py
          ZIP_PATH="dist/ForeverSuite-v${VER}.zip"
          EXE_PATH="dist/ForeverSuite_Installer.exe"
          test -s "$ZIP_PATH"
          python3 -m zipfile -t "$ZIP_PATH"
          test -s "$EXE_PATH"
          python3 -c 'import pathlib; assert pathlib.Path("dist/ForeverSuite_Installer.exe").read_bytes()[:2] == b"MZ"'

      - name: Publish or update GitHub Release atomically (Draft -> Verify -> Latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          EXE_PATH="dist/ForeverSuite_Installer.exe"
          ZIP_PATH="dist/ForeverSuite-${TAG}.zip"
          if gh release view "$TAG" --repo "$REPO_SLUG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$EXE_PATH" "$ZIP_PATH" --repo "$REPO_SLUG" --clobber
            gh release edit "$TAG" --repo "$REPO_SLUG" --draft=false --latest
          else
            gh release create "$TAG" "$EXE_PATH" "$ZIP_PATH" \
              --repo "$REPO_SLUG" \
              --target "$TAG" \
              --title "ForeverSuite ${TAG} + 갓존슨 v5.236" \
              --generate-notes \
              --draft
            gh release edit "$TAG" --repo "$REPO_SLUG" --draft=false --latest
          fi

      - name: Send verified release notification emails (when secrets configured)
        env:
          VER: ${{ steps.meta.outputs.version }}
          REPO_SLUG: ${{ github.repository }}
          FOREVERSUITE_RELEASE_RECIPIENTS: ${{ secrets.RELEASE_RECIPIENTS }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          set -euo pipefail
          if [ -z "$FOREVERSUITE_RELEASE_RECIPIENTS" ]; then
            echo "[INFO] secrets.RELEASE_RECIPIENTS not configured; skipping cloud mailing."
            exit 0
          fi
          if [ -z "$GMAIL_TOKEN_JSON" ] && { [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ]; }; then
            echo "[INFO] Neither GMAIL_TOKEN_JSON nor SMTP_USER/SMTP_PASS secret configured; skipping cloud mailing."
            exit 0
          fi
          python3 scripts/notify_release.py \
            --version "$VER" \
            --repo-slug "$REPO_SLUG"
