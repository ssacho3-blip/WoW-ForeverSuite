[package]
name = "fsx"
version = "0.1.0"
edition = "2021"
description = "ForeverSuite v2 Rust toolchain: AST check, Lua 5.1 mlua test + Secret fuzzer, LoD data compiler, atomic installer, taint reporter"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
full_moon = "2.0"
mlua = { version = "0.10", features = ["lua51", "vendored"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.14"
